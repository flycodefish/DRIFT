# DE-ASFL 可扩展性实验 — CIFAR-100 数据集
# 50客户端，100轮，CNN模型，Mesh拓扑
# 验证：100类 + 50客户端 = 更强的数据异构性 × 更大的网络规模

# ==================== 实验设置 ====================
experiment_name: de_asfl_cifar100
output_dir: outputs
seed: 42

# ==================== 数据集设置 ====================
dataset: cifar100
data_dir: ./data

# ==================== 模型设置 ====================
model: resnet18
num_classes: 100

# ==================== 训练设置 ====================
num_clients: 50
rounds: 150
local_epochs: 2
batch_size: 16
learning_rate: 0.001
weight_decay: 0.0001

# ==================== 学习率调度设置 ====================
learning_rate_min: 1e-4
warmup_rounds: 5
cosine_annealing: true

# ==================== 数据划分设置 ====================
partition: dirichlet
alpha: 0.1

# ==================== 算法设置 ====================
algorithm: de_asfl
aggregation_strategy: hierarchical_weighted

# ==================== 拓扑设置 ====================
topology_type: mesh
neighbor_selection: random
min_neighbors: 3
max_neighbors: 4

# ==================== 选举设置 ====================
enable_election: true
election_base_trigger_time: 10.0
election_trigger_factor: 0.1
cpu_cores_range: [2, 16]
memory_gb_range: [4, 64]
bandwidth_mbps_range: [50, 1000]
gpu_memory_gb_range: [0, 32]

# ==================== 聚类设置 ====================
enable_clustering: true
cluster_max_child: 3
cluster_max_retry: 3
cluster_request_timeout: 2.0
cluster_offset: 30.0
cluster_trigger_factor: 0.05
distribution_similarity_threshold: 0.2

# ==================== 通信设置 ====================
bandwidth: null
latency: null
drop_rate: 0.0
async_communication: true

# ==================== 设备设置 ====================
use_gpu: true
num_gpus: 0.04
