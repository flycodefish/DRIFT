# DTD Configuration — NEU Steel Surface Defect, 12 clients, Dirichlet α=0.1

algorithm: dtd
program_name: dtd_neu
jsd_temperature: 1.0

topology: mesh
neighbor_strategy: random_per_round
neighbor_k: 3

seed: 42
num_clients: 12
rounds: 80
local_epochs: 2
batch_size: 32
learning_rate: 0.001
learning_rate_min: 1e-4
warmup_rounds: 5
cosine_annealing: true
client_sample_ratio: 1.0
client_drop_rate: 0.0

dataset: neu
model: cnn
num_classes: 6
input_dim: 3072

data_partition_mode: dirichlet
dirichlet_alpha: 0.1
classes_per_client: 2

link_bandwidth_mbps: 100.0
link_latency_ms: 5.0
link_drop_rate: 0.0
link_profile_mode: homogeneous

client_speed_mode: uniform
client_network_mode: uniform
client_storage_mode: uniform

output_dir: outputs
