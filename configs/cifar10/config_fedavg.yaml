# Federated Learning Configuration
# CIFAR-10数据集，30客户端，50轮，Resnet18模型，异构数据参数0.1

# Algorithm settings
algorithm: fedavg  # fedavg | gossip
program_name: fedavg_cifar10

# Topology settings
topology: star  # star | ring | mesh
neighbor_strategy: random_per_round  # fixed | random_per_round
neighbor_k: 3

# Training settings
seed: 42
deterministic_training: true
num_clients: 30
rounds: 100
local_epochs: 2
batch_size: 64
learning_rate: 0.001
weight_decay: 0.0001
learning_rate_min: 1e-4
warmup_rounds: 5
cosine_annealing: true
client_sample_ratio: 1.0
client_drop_rate: 0.0

# Data settings
dataset: cifar10  # synthetic | cifar10
data_dir: ./data
model: resnet18  # cnn | resnet18
num_classes: 10
input_dim: 3072  # CIFAR-10: 32x32x3 = 3072

# Data partition settings
data_partition_mode: dirichlet  # iid | label_skew | dirichlet
dirichlet_alpha: 0.1  # 异构数据参数，越小越异构
classes_per_client: 2

# Network settings
link_bandwidth_mbps: 100.0
link_latency_ms: 5.0
link_drop_rate: 0.0
link_profile_mode: homogeneous  # homogeneous | role_aware

# Client heterogeneity settings
client_speed_mode: uniform  # uniform | two_group
client_network_mode: uniform  # uniform | two_group
client_storage_mode: uniform  # uniform | two_group

# Output settings
output_dir: outputs
use_gpu: true
num_gpus: 0.066
max_concurrent_gpu_clients: 8
