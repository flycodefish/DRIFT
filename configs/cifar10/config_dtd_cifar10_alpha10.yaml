# DTD Configuration — CIFAR-10, 30 clients, Dirichlet α=10

algorithm: dtd
program_name: dtd_cifar10_alphaalpha10
jsd_temperature: 1.0

topology: mesh
neighbor_strategy: random_per_round
neighbor_k: 3

seed: 42
num_clients: 30
rounds: 100
local_epochs: 2
batch_size: 64
learning_rate: 0.001
learning_rate_min: 1e-4
warmup_rounds: 5
cosine_annealing: true
client_sample_ratio: 1.0
client_drop_rate: 0.0

dataset: cifar10
model: resnet18
num_classes: 10
input_dim: 3072

data_partition_mode: dirichlet
dirichlet_alpha: 10
classes_per_client: 2

link_bandwidth_mbps: 100.0
link_latency_ms: 5.0
link_drop_rate: 0.0
link_profile_mode: homogeneous

client_speed_mode: uniform
client_network_mode: uniform
client_storage_mode: uniform

output_dir: outputs
